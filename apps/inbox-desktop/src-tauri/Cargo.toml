[package]
name = "message-matrix-inbox"
version = "0.1.0"
description = "Message Matrix unified inbox"
authors = ["Message Matrix"]
edition = "2021"

[lib]
name = "message_matrix_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
